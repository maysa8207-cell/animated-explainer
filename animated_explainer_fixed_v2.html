function playAudio(){bus();if(stopA)stopA();t0=ac.currentTime-cur;stopA=sched(ac,master,t0,cur)}
async function play(){if(busy)return;bus();await ac.resume();if(cur>=PL.total-.05)cur=0;playing=true;playAudio();$('pl').textContent='⏸'}
function pause(){playing=false;if(stopA){stopA();stopA=null}$('pl').textContent='▶'}
function seek(t){cur=clamp(t,0,PL.total);if(playing){playAudio()}draw()}
function loop(){if(playing){cur=ac.currentTime-t0;if(cur>=PL.total){cur=PL.total;pause()}draw()}requestAnimationFrame(loop)}
$('pl').onclick=()=>playing?pause():play();
$('sl').oninput=e=>seek(e.target.value/1000*PL.total);
$('mu').onclick=()=>{muted=!muted;$('mu').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:1};
$('fs').onclick=()=>{const e=$('stage');(e.requestFullscreen||e.webkitRequestFullscreen||(()=>{})).call(e)};
$('af').onchange=async e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;
 pause();
 try{
  if(!/\\.mp3$/i.test(f.name)&&f.type!=='audio/mpeg'&&!f.type.startsWith('audio/')){
   throw new Error('กรุณาเลือกไฟล์เสียง MP3');
  }
  await loadAudio(f);
  $('warn').textContent='นำเข้าเสียงแล้ว · '+f.name;
 }catch(err){
  alert('อ่านไฟล์เสียงไม่ได้: '+(err&&err.message?err.message:String(err)));
 }finally{
  e.target.value='';
 }
};
function syncUI(){const d=$('sy');d.innerHTML='';SC.forEach((s,i)=>{const r=document.createElement('div');r.className='row';
 const b=document.createElement('button');b.className='nm';b.textContent='S'+(i+1)+' · '+fmt(i?PL.b[i]:0)+' · '+s.n.slice(0,16)+'…';b.onclick=()=>seek((i?PL.b[i]:0)+.01);r.appendChild(b);
 if(i){[-.1,.1].forEach(dv=>{const x=document.createElement('button');x.textContent=(dv>0?'+':'−')+'0.1';x.onclick=()=>{adj[i]+=dv;buildPlan();syncUI();draw()};r.appendChild(x)})}d.appendChild(r)})}
// ---- export (MediaRecorder) ----
let cancelX=false;
$('cn').onclick=()=>{cancelX=true};
$('ex').onclick=async()=>{
 const em=$('em'),pg=$('pg'),res=$('res');$('exp').style.display='block';res.innerHTML='';pg.value=0;cancelX=false;
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){em.textContent='เบราว์เซอร์นี้ไม่รองรับการบันทึกวิดีโอ (MediaRecorder/captureStream)';return}
 pause();bus();await ac.resume();busy=true;
 const hi=$('hq').checked,mob=matchMedia('(pointer:coarse)').matches,w=(hi||!mob)?1080:720,h=Math.round(w*16/9);
 const ec=document.createElement('canvas');ec.width=w;ec.height=h;const ex=ec.getContext('2d');
 const dest=ac.createMediaStreamDestination(),cp=ac.createDynamicsCompressor();cp.connect(dest);
 const stream=ec.captureStream(30);dest.stream.getAudioTracks().forEach(k=>stream.addTrack(k));
 const mt=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
 let rec;try{rec=new MediaRecorder(stream,Object.assign(mt?{mimeType:mt}:{},{videoBitsPerSecond:w>800?8e6:4e6}))}catch(e){em.textContent='สร้าง MediaRecorder ไม่ได้: '+e.message;busy=false;return}
 const parts=[];rec.ondataavailable=e=>e.data&&e.data.size&&parts.push(e.data);
 em.textContent='วิธี: บันทึกแบบเรียลไทม์ ('+(mt||'ค่าเริ่มต้น')+', '+w+'×'+h+') — เปิดหน้านี้ค้างไว้ ~'+Math.ceil(PL.total)+' วินาที';
 let wl=null;try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 const start=performance.now(),T=ac.currentTime+.25,stop=sched(ac,cp,T,0);rec.start(500);
 const done=new Promise(r=>{rec.onstop=r});
 await new Promise(r=>{(function f(){const t=ac.currentTime-T;renderAtTime(ex,t,w/W);pg.value=clamp(t/PL.total)*100;em.textContent=Math.round(clamp(t/PL.total)*100)+'% · '+Math.round(clamp(t,0,PL.total)*30)+'/'+Math.round(PL.total*30)+' เฟรม · '+((performance.now()-start)/1000).toFixed(0)+' วิ';
  if(cancelX||t>=PL.total+.3)r();else requestAnimationFrame(f)})()});
 stop();rec.state!='inactive'&&rec.stop();await done;try{wl&&wl.release()}catch(e){}busy=false;
 if(cancelX){em.textContent='ยกเลิกแล้ว';return}
 const type=(rec.mimeType||mt||'video/webm').split(';')[0],ext=type.includes('mp4')?'mp4':'webm',blob=new Blob(parts,{type}),url=URL.createObjectURL(blob);
 if(!blob.size){em.textContent='ไม่ได้ไฟล์วิดีโอ (ข้อมูลว่าง)';return}
 em.textContent='เสร็จแล้ว ('+ext.toUpperCase()+', '+(blob.size/1048576).toFixed(1)+' MB)';pg.value=100;
 res.innerHTML='<video controls playsinline src="'+url+'"></video>';
 const file=new File([blob],'ผีตากผ้าอ้อม.'+ext,{type}),row=document.createElement('div');row.className='row';
 if(navigator.canShare&&navigator.canShare({files:[file]})){const b=document.createElement('button');b.className='pri';b.textContent='บันทึก/แชร์';b.onclick=()=>navigator.share({files:[file]}).catch(()=>{});row.appendChild(b)}
 const a=document.createElement('a');a.className='btn';a.href=url;a.download=file.name;a.textContent='ดาวน์โหลด .'+ext;row.appendChild(a);res.appendChild(row);
 const tip=document.createElement('div');tip.style.fontSize='12px';tip.textContent='ถ้าบันทึกไม่ได้ ให้กดค้างที่วิดีโอเพื่อบันทึก';res.appendChild(tip)};
// ---- init ----
(async()=>{try{await document.fonts.ready;await document.fonts.load('700 56px Prompt','ผีตากผ้าอ้อม')}catch(e){}buildPlan();syncUI();draw();loop()})();
</script></body></html>
